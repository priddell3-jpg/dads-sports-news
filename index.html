<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Dad's Sports News</title>
<style>
  :root{
    --bg:#0b1220; --panel:#131c2e; --panel2:#1b2740; --line:#26324d;
    --text:#eef2f9; --muted:#9fb0cc; --accent:#4f8cff;
    --liv:#e01a22; --wout:#f4c430; --whi:#0a2342; --whi-a:#3d7bd6;
    --ok:#2ecc71;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 16px 64px}

  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg,rgba(11,18,32,.98),rgba(11,18,32,.92));
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:18px 16px 12px;
  }
  header .inner{max-width:820px; margin:0 auto}
  h1{font-size:26px; margin:0 0 2px; letter-spacing:.2px}
  .sub{color:var(--muted); font-size:14px; margin:0 0 12px}

  .tabs{display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px}
  .tab{
    flex:0 0 auto; cursor:pointer; border:1px solid var(--line);
    background:var(--panel); color:var(--text); padding:9px 14px;
    border-radius:999px; font-size:15px; font-weight:600; white-space:nowrap;
    display:flex; align-items:center; gap:7px; transition:.15s;
  }
  .tab:hover{background:var(--panel2)}
  .tab .dot{width:9px; height:9px; border-radius:50%}
  .tab.active{border-color:var(--accent); background:var(--panel2)}
  .tab .count{
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
    padding:0 7px; font-size:12px; color:var(--muted); min-width:20px; text-align:center;
  }
  .tab .count:empty{display:none}
  .tab.active .count{color:var(--text)}
  .dot-all{background:var(--accent)}
  .dot-liv{background:var(--liv)}
  .dot-wout{background:var(--wout)}
  .dot-whi{background:var(--whi-a)}

  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0 8px}
  .updated{color:var(--muted); font-size:13px}
  .refresh{
    cursor:pointer; border:1px solid var(--line); background:var(--panel);
    color:var(--text); border-radius:10px; padding:8px 14px; font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:7px;
  }
  .refresh:hover{background:var(--panel2)}
  .refresh:disabled{opacity:.5; cursor:default}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .card{
    display:block; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line); border-left-width:4px;
    border-radius:14px; padding:15px 16px; margin:10px 0; transition:.15s;
  }
  .card:hover{background:var(--panel2); transform:translateY(-1px)}
  .card.liv{border-left-color:var(--liv)}
  .card.wout{border-left-color:var(--wout)}
  .card.whi{border-left-color:var(--whi-a)}
  .card .headline{font-size:18px; font-weight:650; margin:0 0 6px}
  .card .summary{
    font-size:14.5px; color:var(--muted); margin:0 0 10px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
  .pub{
    display:inline-flex; align-items:center; gap:5px; font-weight:600; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); padding:3px 9px; border-radius:999px;
  }
  .verified{color:var(--ok); font-size:12px}
  .topic-pill{padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600}
  .topic-pill.liv{background:rgba(224,26,34,.15); color:#ff8a8f}
  .topic-pill.wout{background:rgba(244,196,48,.15); color:#f6d472}
  .topic-pill.whi{background:rgba(61,123,214,.18); color:#9cc0ff}

  .status{text-align:center; color:var(--muted); padding:40px 16px; font-size:15px}
  .status.err{color:#ff9a9a}
  .status .big{font-size:34px; display:block; margin-bottom:8px}
  .retry{margin-top:14px; display:inline-block; cursor:pointer; border:1px solid var(--line);
    background:var(--panel); color:var(--text); border-radius:10px; padding:9px 16px; font-weight:600}

  .foot{color:var(--muted); font-size:12px; text-align:center; margin-top:26px; line-height:1.7}
  a.inline{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>Dad's Sports News</h1>
    <p class="sub">Latest verified headlines · updates automatically</p>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<div class="wrap">
  <div class="bar">
    <span class="updated" id="updated">Loading…</span>
    <button class="refresh" id="refreshBtn" onclick="loadAll(true)">
      <span id="refreshIcon">↻</span> Refresh
    </button>
  </div>
  <div id="feed"></div>
  <div class="foot">
    Headlines are pulled live from Google News and Bing News and shown with their original
    publisher, so you can always see and trust the source. Tap any story to read the full article.<br>
    Made for Dad ⚽🚴
  </div>
</div>

<script>
/* ------------------------------------------------------------------ *
 *  EDIT HERE to change what news shows up.
 *  Each topic is searched on BOTH Google News and Bing News, then merged.
 *  Add/remove topics freely. "days" = how far back Google should look.
 * ------------------------------------------------------------------ */
const TOPICS = [
  { id:"liv",  label:"Liverpool FC",        cls:"liv",  q:'"Liverpool FC"',        days:14 },
  { id:"wout", label:"Wout van Aert",       cls:"wout", q:'"Wout van Aert"',       days:30 },
  { id:"whi",  label:"Vancouver Whitecaps", cls:"whi",  q:'"Vancouver Whitecaps"', days:21 },
];

const MAX_PER_TOPIC = 12;
let activeTab = "all";
let cache = {};        // topicId -> array of items

/* ---- feed URLs ---- */
const googleUrl = t =>
  "https://news.google.com/rss/search?q=" +
  encodeURIComponent(t.q + " when:" + t.days + "d") + "&hl=en-US&gl=US&ceid=US:en";
// Wider fallback: same search but with NO date limit, used only if the window is empty.
const googleUrlBroad = t =>
  "https://news.google.com/rss/search?q=" +
  encodeURIComponent(t.q) + "&hl=en-US&gl=US&ceid=US:en";
const bingUrl = t =>
  "https://www.bing.com/news/search?q=" + encodeURIComponent(t.q) + "&format=rss";

/* ---- CORS helpers: browsers can't read a feed cross-site without a middleman ---- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://thingproxy.freeboard.io/fetch/" + u,
];

// Returns array of raw items: {title, link, pubDate, description, source}
async function viaProxy(url){
  let lastErr;
  for(const proxy of PROXIES){
    try{
      const res = await fetch(proxy(url), {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      if(!txt || txt.indexOf("<item") === -1) throw new Error("empty");
      const doc = new DOMParser().parseFromString(txt, "text/xml");
      const items = [...doc.querySelectorAll("item")].map(it => ({
        title: it.querySelector("title")?.textContent || "",
        link: it.querySelector("link")?.textContent || "",
        pubDate: it.querySelector("pubDate")?.textContent || "",
        description: it.querySelector("description")?.textContent || "",
        source: it.querySelector("source")?.textContent || "",
      }));
      if(items.length) return items;
      throw new Error("no items");
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("all proxies failed");
}

// Backup path: RSS-to-JSON service (proper CORS). No <source>, but has description.
async function viaRss2Json(url){
  const api = "https://api.rss2json.com/v1/api.json?count=15&rss_url=" + encodeURIComponent(url);
  const res = await fetch(api, {cache:"no-store"});
  if(!res.ok) throw new Error("rss2json HTTP " + res.status);
  const data = await res.json();
  if(data.status !== "ok" || !Array.isArray(data.items) || !data.items.length)
    throw new Error("rss2json empty");
  return data.items.map(i => ({
    title:i.title||"", link:i.link||"", pubDate:i.pubDate||"",
    description:i.description||"", source:i.author||"",
  }));
}

async function fetchRaw(url){
  try{ return await viaProxy(url); }
  catch(e){ return await viaRss2Json(url); }
}

/* ---- text helpers ---- */
function stripHtml(s){
  if(!s) return "";
  const d = new DOMParser().parseFromString(s, "text/html");
  return (d.body.textContent || "").replace(/\s+/g, " ").trim();
}
function prettySource(link){
  try{
    let h = new URL(link).hostname.replace(/^www\./, "");
    return h;
  }catch(e){ return "News"; }
}

/* ---- normalisers ---- */
function fromGoogle(raw, t){
  let title = (raw.title || "").trim();
  let pub = (raw.source || "").trim();
  if(pub && title.endsWith(" - " + pub)) title = title.slice(0, -(pub.length + 3)).trim();
  if(!pub){
    const m = title.match(/\s[-–]\s([^-–]+)$/);
    if(m){ pub = m[1].trim(); title = title.slice(0, m.index).trim(); }
  }
  return {
    title, link:(raw.link||"").trim(), pub: pub || "News",
    summary:"",                                   // Google News carries no snippet
    date:new Date(raw.pubDate || Date.now()),
    topic:t.id, cls:t.cls, topicLabel:t.label,
  };
}
function fromBing(raw, t){
  const title = (raw.title || "").trim();
  let summary = stripHtml(raw.description);
  if(summary && summary.toLowerCase() === title.toLowerCase()) summary = "";
  if(summary.length > 220) summary = summary.slice(0, 217).trim() + "…";
  const link = (raw.link || "").trim();
  return {
    title, link, pub: prettySource(link), summary,
    date:new Date(raw.pubDate || Date.now()),
    topic:t.id, cls:t.cls, topicLabel:t.label,
  };
}

/* ---- load one topic from both sources, then merge ---- */
function mergeItems(bingItems, googleItems){
  const map = new Map();
  const keyOf = it => it.title.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 55);
  const add = it => {
    if(!it.title || !it.link) return;
    const k = keyOf(it);
    const ex = map.get(k);
    if(!ex){ map.set(k, it); return; }
    if(!ex.summary && it.summary) map.set(k, it);   // keep the version that has a preview
  };
  bingItems.forEach(add);    // Bing first so summary-bearing items win dedupe
  googleItems.forEach(add);
  return [...map.values()];
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Fetch both sources for one topic, one after the other (not at once) to stay
// under the rate limits of the free fetch services.
async function loadTopic(t){
  let goog = [], bing = [];
  try{ goog = (await fetchRaw(googleUrl(t))).map(x => fromGoogle(x, t)); }catch(e){}
  await sleep(350);
  try{ bing = (await fetchRaw(bingUrl(t))).map(x => fromBing(x, t)); }catch(e){}
  let merged = mergeItems(bing, goog);
  if(!merged.length){                         // nothing inside the date window → widen the search
    try{
      await sleep(300);
      const g2 = (await fetchRaw(googleUrlBroad(t))).map(x => fromGoogle(x, t));
      merged = mergeItems(bing, g2);
    }catch(e){}
  }
  if(!merged.length) throw new Error("no results");
  return merged
    .sort((a, c) => c.date - a.date)
    .slice(0, MAX_PER_TOPIC);
}

let loading = false;
async function loadAll(){
  if(loading) return;                       // avoid overlapping runs
  loading = true;
  const btn = document.getElementById("refreshBtn");
  const icon = document.getElementById("refreshIcon");
  btn.disabled = true; icon.classList.add("spin");
  document.getElementById("updated").textContent = "Getting the latest…";
  if(!Object.keys(cache).length) showStatus("⏳","Loading the latest headlines…");

  // Load topics ONE AT A TIME with a gap, and show each as soon as it arrives.
  let anyOk = false;
  for(const t of TOPICS){
    try{
      const items = await loadTopic(t);
      if(items.length){ cache[t.id] = items; anyOk = true; render(); }
    }catch(e){ /* keep going; other topics may still work */ }
    await sleep(500);
  }

  btn.disabled = false; icon.classList.remove("spin");
  loading = false;

  if(!anyOk && !Object.keys(cache).length){
    showStatus("😕","Couldn't reach the news right now.",
      "The connection may be busy — tap to try again.", true);
    document.getElementById("updated").textContent = "Update failed";
    return;
  }
  stampUpdated();
  render();
}

/* ---------- rendering ---------- */
function timeAgo(d){
  const s = Math.floor((Date.now() - d.getTime())/1000);
  if(s < 60) return "just now";
  const m = Math.floor(s/60); if(m < 60) return m+" min ago";
  const h = Math.floor(m/60); if(h < 24) return h+(h===1?" hour ago":" hours ago");
  const dy = Math.floor(h/24); if(dy < 7) return dy+(dy===1?" day ago":" days ago");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function collect(){
  let list = [];
  TOPICS.forEach(t => {
    if(activeTab === "all" || activeTab === t.id) list = list.concat(cache[t.id] || []);
  });
  return list.sort((a,b) => b.date - a.date);
}
function render(){
  refreshCounts();
  const list = collect();
  const feed = document.getElementById("feed");
  if(!list.length){ showStatus("📭","No stories yet for this section."); return; }
  const showTopic = activeTab === "all";
  feed.innerHTML = list.map(it => `
    <a class="card ${it.cls}" href="${it.link}" target="_blank" rel="noopener">
      <p class="headline">${esc(it.title)}</p>
      ${it.summary ? `<p class="summary">${esc(it.summary)}</p>` : ``}
      <div class="meta">
        <span class="pub">✓ ${esc(it.pub)}</span>
        <span class="verified">verified source</span>
        <span>·</span><span>${timeAgo(it.date)}</span>
        ${showTopic ? `<span class="topic-pill ${it.cls}">${esc(it.topicLabel)}</span>` : ``}
      </div>
    </a>`).join("");
}
function showStatus(big,msg,sub,retry){
  document.getElementById("feed").innerHTML =
    `<div class="status ${retry?"err":""}">
       <span class="big">${big}</span>${esc(msg)}
       ${sub?`<br><span style="font-size:13px">${esc(sub)}</span>`:""}
       ${retry?`<br><span class="retry" onclick="loadAll()">Try again</span>`:""}
     </div>`;
}
function stampUpdated(){
  const now = new Date();
  document.getElementById("updated").textContent =
    "Updated " + now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- tabs ---------- */
function buildTabs(){
  const defs = [{id:"all",label:"All",dot:"dot-all"},
    ...TOPICS.map(t => ({id:t.id,label:t.label,dot:"dot-"+t.id}))];
  document.getElementById("tabs").innerHTML = defs.map(d =>
    `<div class="tab ${d.id==="all"?"active":""}" data-id="${d.id}" onclick="setTab('${d.id}')">
       <span class="dot ${d.dot}"></span>${d.label}<span class="count" id="count-${d.id}"></span></div>`).join("");
}
function refreshCounts(){
  const total = TOPICS.reduce((n,t) => n + (cache[t.id]?.length || 0), 0);
  const set = (id,n) => { const el = document.getElementById("count-"+id); if(el) el.textContent = n ? n : ""; };
  set("all", total);
  TOPICS.forEach(t => set(t.id, cache[t.id]?.length || 0));
}
function setTab(id){
  activeTab = id;
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.id === id));
  render();
}

/* ---------- boot ---------- */
buildTabs();
loadAll();
setInterval(loadAll, 15*60*1000);                          // auto-refresh every 15 min
document.addEventListener("visibilitychange", () => { if(!document.hidden) loadAll(); });
</script>
</body>
</html>
